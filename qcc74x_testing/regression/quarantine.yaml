- scenarios:
    - drivers.gpio.2pin
  platforms:
    - qcc748m_evk/qcc748
  comment: >
    Upstream zephyr/tests/drivers/gpio/gpio_basic_api test_gpio_callback_variants
    fails "double edge not detected" for GPIO_INT_EDGE_BOTH on QCC748M hardware
    (confirmed pre-existing on 2026-08-04/2026-08-05 runs, unrelated to the
    2026-08-11 drivers.gpio.2pin.qcc rename). Root cause: the upstream
    test_callback_trigger.c generates the second output transition from the
    interrupt callback itself, which the QCC74x GPIO/interrupt path cannot
    reliably deliver for both-edge triggers. The fix requires modifying the
    upstream zephyr/ test source (delay the second transition to thread
    context), which is out of scope per CLAUDE.md's "zephyr/ must stay
    unmodified" rule. The project-owned drivers.gpio.2pin.qcc scenario
    (qapp/qcc74x/qcc74x_testing/tests/drivers/gpio/gpio_basic_api) already
    carries this fix and passes. This scenario is not normally scheduled on
    QCC boards anyway (no platform_allow, no native QCC board overlay under
    zephyr/tests/drivers/gpio/gpio_basic_api/boards/ -- it only runs if
    someone manually injects -x DTC_OVERLAY_FILE=.../board_overlays/gpio_basic_api/qcc748m_evk.overlay).
    This entry guards against that being done under commit/merge/nightly
    levels without being flagged as a known, non-regressed failure.
