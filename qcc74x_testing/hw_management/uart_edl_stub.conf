# Unified EDL trigger conf for QCC74x twister device testing.
#
# This single conf works regardless of whether the tested app has
# CONFIG_SHELL=y or not:
#
#   - App has NO shell → CONFIG_QCC74X_UART_EDL_TRIGGER=y takes effect,
#     the lightweight UART listener matches "platform reboot --edl\r\n"
#     and enters EDL mode.
#
#   - App HAS shell → CONFIG_QCC74X_UART_EDL_TRIGGER depends on !SHELL,
#     so it is automatically ignored by Kconfig. The shell itself handles
#     the "platform reboot --edl" command.
#
# In both cases, the host script (qconn_pre_flash.py) sends the same
# string and the board enters EDL mode. No manual selection needed.
#
# Usage – add to twister command:
#   --extra-args="EXTRA_CONF_FILE=qapp/qcc74x/qcc74x_testing/hw_management/uart_edl_stub.conf"
#
# Size impact (when app has no shell):
#   Flash: ~+1 KB    RAM: ~+25 B

# Enable the lightweight UART EDL trigger.
# If the app already has CONFIG_SHELL=y, this line is harmlessly ignored
# (Kconfig dependency `depends on !SHELL` prevents activation).
CONFIG_QCC74X_UART_EDL_TRIGGER=y

# Required by uart_edl_trigger (interrupt-driven RX callback).
# Harmless if shell is already enabled (shell also needs this).
CONFIG_UART_INTERRUPT_DRIVEN=y

# Delay application start by 2s so twister can open the serial port
# before the banner is printed.  Without this the board boots in <200 ms
# and the banner is output before twister opens the port.
CONFIG_BOOT_DELAY=2000