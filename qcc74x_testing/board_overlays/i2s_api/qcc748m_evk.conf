#
# i2s_api's test_i2s_rx_sync_start and other cases are ZTEST_USER,
# which under Zephyr 4.4's default CONFIG_TEST_USERSPACE=y run inside
# a userspace thread; a zassert failure or syscall boundary check in
# that context escalates to a fatal CPU exception on this SoC instead
# of a graceful test FAIL (same root cause already found and fixed for
# adc_api/pwm_api/uart_async_api in this project).

CONFIG_TEST_USERSPACE=n
