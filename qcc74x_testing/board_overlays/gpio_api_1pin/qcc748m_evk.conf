# Run GPIO interrupt tests in kernel thread mode (not userspace).
# Zephyr 4.4 ZTEST_USER wraps tests in userspace threads; with userspace
# enabled, a zassert failure in gpio_api_1pin_conf escalates and prevents
# ISR registration in subsequent interrupt tests.
CONFIG_TEST_USERSPACE=n
