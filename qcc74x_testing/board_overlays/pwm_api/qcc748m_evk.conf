# qcc748m_evk board conf for zephyr/tests/drivers/pwm/pwm_api.
#
# On real hardware, test_pwm_cycle crashed with "mcause: 5, Load access
# fault" instead of a graceful test FAIL/PASS. This is the same fault
# signature documented in
# docs/2026-07-12-zephyr-test-fix-review.md ("修复二：ADC adc_api 测试")
# for test_adc_invalid_request: Zephyr 4.4 defaults CONFIG_TEST_USERSPACE=y,
# which wraps ZTEST_USER-declared tests (all three tests in this suite —
# test_pwm_nsec, test_pwm_cycle, test_pwm_invalid_port — are ZTEST_USER) in
# userspace threads. In userspace mode, a zassert failure escalates to a
# fatal CPU exception (Load access fault, mcause=5) instead of a normal
# test FAIL. Disabling userspace lets assertion failures surface as
# ordinary ztest FAIL results instead of crashing the CPU.
CONFIG_TEST_USERSPACE=n
