# Enables the DMA-driven ADC sequence path on qcc748m_evk (as opposed to the
# default polling/interrupt path). Pair with qcc748m_evk.overlay, which
# already wires &dma and the adc node's dmas property. Ported from the v4.1
# QCC74x fork's overlay-dma-opal.conf (CONFIG_ADC_OPAL_DMA=y there; renamed
# to CONFIG_ADC_QCC74X_DMA in this driver).
CONFIG_ADC_QCC74X_DMA=y
