#
# qcc748m_evk needs CONFIG_GPIO explicitly enabled for
# zephyr/tests/drivers/pwm/pwm_gpio_loopback — the test's prj.conf only sets
# CONFIG_PWM=y/CONFIG_ZTEST=y, and this board does not select GPIO by
# default from the PWM driver alone. Without this, the build fails at link
# time with "undefined reference to __device_dts_ord_N" for the gpio0
# device referenced by the board overlay's `zephyr,user` gpios property.
CONFIG_GPIO=y
