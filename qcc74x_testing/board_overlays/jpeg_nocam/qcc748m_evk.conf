#
# Custom linker: routes BSS/noinit/heap to PSRAM so JPEG encode buffers
# don't overflow the 319KB internal SRAM.
# itcm/dtcm/ram_data stay in internal SRAM for performance.

CONFIG_HAVE_CUSTOM_LINKER_SCRIPT=y
CONFIG_CUSTOM_LINKER_SCRIPT="linker/qcc748_common.ld"
CONFIG_PSRAM_LENGTH=0x400000
