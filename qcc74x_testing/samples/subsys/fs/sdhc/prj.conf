# Logging for debugging
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Optimization
CONFIG_SPEED_OPTIMIZATIONS=y
#CONFIG_SIZE_OPTIMIZATIONS=y
#CONFIG_NO_OPTIMIZATIONS=y

# sdhc driver
#CONFIG_SDHC_LOG_LEVEL_DBG=y
#CONFIG_SDHC_LOG_LEVEL_INF=y
CONFIG_SDHC_LOG_LEVEL_WRN=y

# sd middleware
#CONFIG_SD_LOG_LEVEL_DBG=y
CONFIG_SD_LOG_LEVEL_WRN=y

# File system
#CONFIG_FS_LOG_LEVEL_DBG=y
CONFIG_FS_LOG_LEVEL_ERR=y

# File system support
CONFIG_FILE_SYSTEM=y         # Enables the Zephyr file system API
CONFIG_FAT_FILESYSTEM_ELM=y  # Enables the FATFS file system implementation (ELM FATFS port)
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_LFN=y        # Enables long file name support for FATFS, useful for filenames longer than 8.3 format
CONFIG_FS_FATFS_MKFS=y       # Enables creating disks with FAT file system
CONFIG_FS_FATFS_MOUNT_MKFS=y # Allows automatic formatting of the SD card if no valid filesystem is detected
CONFIG_FS_FATFS_EXFAT=y      # Enable the exFAT format support for FatFs

# Disk access for SD card
CONFIG_DISK_ACCESS=y         # Enables the disk access API for interacting with storage devices like SD cards
CONFIG_DISK_DRIVER_SDMMC=y   # Enables the SD/MMC driver for SD card communication
CONFIG_DISK_DRIVER_MMC=n

# Hardware support (example for SDMMC)
CONFIG_SDMMC_STACK=y
CONFIG_MMC_STACK=n
CONFIG_SDIO_STACK=n

# Common
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# WAR: Hang happens when enable PSRAM, comment it for now
# TODO: need to check the root cause
CONFIG_PSRAM=n