CONFIG_POSIX_API=y
CONFIG_EVENTFD=y
CONFIG_ZVFS_FDTABLE=y
CONFIG_POSIX_TIMERS=y
CONFIG_PRINTK=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_COMPILER_COLOR_DIAGNOSTICS=y
