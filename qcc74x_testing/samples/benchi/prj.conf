# CTF tracing
CONFIG_THREAD_NAME=y
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_BACKEND_RAM=y
CONFIG_RAM_TRACING_BUFFER_SIZE=131072
CONFIG_TRACING_BUFFER_SIZE=131072

#Percepio tracing
# CONFIG_TRACING=y
# CONFIG_PERCEPIO_TRACERECORDER=y
# CONFIG_PERCEPIO_TRC_START_MODE_START=n
# CONFIG_PERCEPIO_TRC_CFG_STREAM_PORT_RINGBUFFER=y
# CONFIG_PERCEPIO_TRC_CFG_STREAM_PORT_RINGBUFFER_SIZE=100000

CONFIG_TRACING_CONDVAR=n
CONFIG_TRACING_EVENT=n
CONFIG_TRACING_FIFO=n
CONFIG_TRACING_HEAP=n
CONFIG_TRACING_ISR=n
CONFIG_TRACING_LIFO=n
CONFIG_TRACING_MAILBOX=n
CONFIG_TRACING_MEMORY_SLAB=n
CONFIG_TRACING_MESSAGE_QUEUE=n
CONFIG_TRACING_MUTEX=n
CONFIG_TRACING_NET_CORE=n
CONFIG_TRACING_NET_SOCKETS=n
CONFIG_TRACING_NETWORKING=n
CONFIG_TRACING_PIPE=n
CONFIG_TRACING_PM=n
CONFIG_TRACING_POLLING=n
CONFIG_TRACING_QUEUE=n
CONFIG_TRACING_SEMAPHORE=n
CONFIG_TRACING_STACK=n
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_THREAD=n
CONFIG_TRACING_TIMER=n
CONFIG_TRACING_WORK=n


# filesystem
CONFIG_ZVFS_EVENTFD_MAX=16

# stats
CONFIG_STATS=y
CONFIG_STATS_SHELL=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y

# shell
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_DATE_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1000

# log
CONFIG_LOG=y
CONFIG_LOG_THREAD_ID_PREFIX=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_RUNTIME_FILTERING=y
#CONFIG_LOG_DEFAULT_LEVEL=3

# zbus
CONFIG_ZBUS=y
CONFIG_ZBUS_LOG_LEVEL_INF=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

# wifi
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
#CONFIG_DNS_RESOLVER_LOG_LEVEL_DBG=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_LOG=y
CONFIG_NET_MAX_CONN=50
CONFIG_INIT_STACKS=y
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PERIODIC_OUTPUT=n
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# TLS configuration
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=2048
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=6
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=5

#CONFIG_MBEDTLS_DEBUG=y
#CONFIG_MBEDTLS_LOG_LEVEL_DBG=y
# Automatic Kconfig selection for NET_SOCKETS_SOCKOPT_TLS was removed in
# Zephyr 4.4 (see doc/releases/migration-guide-4.4.rst, Networking section)
# -- the desired TLS protocol version + ciphersuite must now be selected
# explicitly via a MBEDTLS_CIPHERSUITE_TLS_* helper, which pulls in
# MBEDTLS_SSL_PROTO_TLS1_2, MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED, and
# the matching PSA_WANT_* symbols this sample previously set by hand
# (CONFIG_MBEDTLS_MD5/ECDH_C/ECDSA_C/ECP_C/ECP_DP_SECP256R1_ENABLED/
# KEY_EXCHANGE_RSA_ENABLED/CIPHER_CCM_ENABLED/CIPHER_GCM_ENABLED, all
# removed/renamed upstream).
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8=y
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_SAMPLE_PSK_HEADER_FILE="bshg_dummy_psk.h"

# filesystem
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_POSIX_FILE_SYSTEM=y
CONFIG_IMG_BLOCK_BUF_SIZE=256
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# PSRAM — routes BSS/heap to 4MB PSRAM (internal SRAM is only 319KB)
CONFIG_PSRAM=y

# PSA_WANT_ALG_MD5 — calculate_hashsum.c calls mbedtls_md5() directly
CONFIG_PSA_WANT_ALG_MD5=y

# execute in place
CONFIG_XIP=y

# Enable networking
CONFIG_NET_HOSTNAME="bsh-benchi"

# Enable HTTP server
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_SERVER_STACK_SIZE=8192

CONFIG_JSON_LIBRARY=y

CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_POLL=y

CONFIG_SPI=y
CONFIG_COUNTER=y

CONFIG_BSHG_IFP_PARALLEL_FLASHING=n
