CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=8192

CONFIG_NET_TX_STACK_SIZE=8192
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_NET_PKT_RX_COUNT=44
CONFIG_NET_PKT_TX_COUNT=44
CONFIG_NET_BUF_RX_COUNT=46
CONFIG_NET_BUF_TX_COUNT=46
CONFIG_NET_BUF_DATA_SIZE=1600
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=64240
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=64240
CONFIG_NET_TC_RX_COUNT=0

CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=2048
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048

# ==================== Memory & Heap ====================
# Heap memory pool size
CONFIG_HEAP_MEM_POOL_SIZE=8192
# Sys heap runtime stats
CONFIG_SYS_HEAP_RUNTIME_STATS=y
# Shared multi-heap support
CONFIG_SHARED_MULTI_HEAP=y
# mbedTLS heap allocation
CONFIG_MBEDTLS_ENABLE_HEAP=y
# ==================== Threads & Workqueue ====================

# System workqueue stack size
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
# Dynamic threads support
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
# Runtime statistics
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y
# Thread info & monitoring
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_CUSTOM_DATA=y
# Initialize all thread stacks
CONFIG_INIT_STACKS=y
# ==================== WiFi Configuration ====================
# QCC74X WiFi driver
CONFIG_WIFI_QCC74X=y
# AP & STA mode support (real Kconfig prefix is QC7XX_WIFI_*, not
# QCC74X_WIFI_* -- pre-existing typo, unrelated to the v4.4 upgrade,
# only surfaced once the mbedtls Kconfig-warning aborts below were fixed)
CONFIG_QC7XX_WIFI_AP_STA_MODE=y
# STA mode auto DHCPv4
CONFIG_QC7XX_WIFI_STA_AUTO_DHCPV4=y
# WiFi network manager
CONFIG_WIFI_NM=y
# Max managed interfaces
CONFIG_WIFI_NM_MAX_MANAGED_INTERFACES=4
# Shell max AP/STA interfaces
CONFIG_WIFI_SHELL_MAX_AP_STA=4
# ==================== Network Buffers & Interfaces ====================
# Number of RX packets
#CONFIG_NET_PKT_RX_COUNT=16
# Number of TX packets
#CONFIG_NET_PKT_TX_COUNT=16
# Network buffer pool size (RX)
#CONFIG_NET_BUF_RX_COUNT=36
# Network buffer pool size (TX)
#CONFIG_NET_BUF_TX_COUNT=36
# Max IPv4 addresses per interface
CONFIG_NET_IF_MAX_IPV4_COUNT=2
# Max IPv6 addresses per interface
CONFIG_NET_IF_MAX_IPV6_COUNT=2
# Enable Ethernet L2
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ZPERF=y
#CONFIG_NET_BUF_FIXED_DATA_SIZE=n

# ==================== Network Management ====================
# Net management event queue size
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
# Net management event handler stack size
CONFIG_NET_MGMT_EVENT_STACK_SIZE=8192
# Enable network connection manager
CONFIG_NET_CONNECTION_MANAGER=y
# ==================== IPv4 & DHCPv4 ====================
# Number of DHCPv4 server addresses
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=4
# ICMP probe timeout for DHCPv4 (ms)
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=1000
# Enable DHCPv4 server
CONFIG_NET_DHCPV4_SERVER=y
# Enable DHCPv4 DNS address option
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
# DHCPv4 server log level: debug
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_DBG=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=4
#CONFIG_NET_SOCKETS_ENABLE_DTLS=y
# DNS query timeout (ms)
#CONFIG_NET_SOCKETS_DNS_TIMEOUT=2000
# DNS backoff interval (ms)
#CONFIG_NET_SOCKETS_DNS_BACKOFF_INTERVAL=5000
# Enable Sockets service
#CONFIG_NET_SOCKETS_SERVICE=y
# Service thread priority
#CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=15
# Service thread stack size
#CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
#CONFIG_MBEDTLS_DTLS=y
CONFIG_ZVFS_POLL_MAX=15
#CONFIG_NET_BUF_DATA_SIZE=64
# CONFIG_MBEDTLS_ECP_C/_ECP_DP_SECP256R1_ENABLED/_PEM_CERTIFICATE_FORMAT
# were removed in Zephyr 4.4 -- superseded by the
# MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256 helper now
# set in prj.conf, which selects the equivalent PSA_WANT_ECC_SECP_R1_256
# path. CONFIG_MBEDTLS_ECP_NIST_OPTIM has no removal notice but has no
# effect without CONFIG_MBEDTLS_ECP_C, so dropped alongside it.
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_DNS_RESOLVER_AUTO_INIT=n
# mcuboot is intentionally excluded from this workspace's manifest
# (west_manifest/west_qcc740_github_dev.yml has "#- mcuboot" commented
# out), but CONFIG_IMG_MANAGER's only backend choice is
# CONFIG_MCUBOOT_IMG_MANAGER, so it can never build here.
CONFIG_IMG_MANAGER=n
# qcc74x_zephyr_hal's wifi_drv_lower.c reads struct net_buf_pool's
# avail_count/max_used/name fields, which are compiled out unless this
# is set (already set for the same reason in the sibling
# boards/qcc75xm_evk.conf).
CONFIG_NET_BUF_POOL_USAGE=y
# qcc74x_zephyr_hal's crypto_mbedtls.c calls mbedtls_ctr_drbg_* directly
# and unconditionally; only compiled in under MBEDTLS_CTR_DRBG_C.
CONFIG_MBEDTLS_CTR_DRBG_C=y
