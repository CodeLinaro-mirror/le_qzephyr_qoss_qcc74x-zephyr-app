#
# Keep PSRAM DTS (zephyr,sram=&psram) so CONFIG_SRAM_BASE_ADDRESS=0xa8000000.
# This fixes the RISC-V GP calculation and keeps itcm small enough for the ROM
# bootloader copy limit. The custom linker places all actual data in OCRAM, so
# PSRAM is never accessed at runtime.
#
# Clear BOARD_PARTITION_CFG_FILE so the firmware post-processor uses the default
# partition_cfg_4M.toml instead of the PSRAM-specific one. The PSRAM partition
# has FW.len=0xa8000000 which tells boot2 to copy firmware to PSRAM before
# jumping — this breaks XIP firmware. The standard partition boots correctly.

CONFIG_HAVE_CUSTOM_LINKER_SCRIPT=y
CONFIG_CUSTOM_LINKER_SCRIPT="linker/qcc748_common.ld"
CONFIG_BOARD_PARTITION_CFG_FILE=""
