sample:
  name: W5500 SPI Ethernet smoke test for QCC7xx

common:
  tags:
    - net
    - ethernet
    - netif:eth
  timeout: 30
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "W5500 SMOKE TEST PASSED"

tests:
  qcc7xx.sample.net.ethernet.ww5500:
    platform_allow:
      - qcc744m_evk
      - qcc748m_evk
