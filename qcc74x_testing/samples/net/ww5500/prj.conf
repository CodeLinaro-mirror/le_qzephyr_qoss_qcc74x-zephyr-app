# Networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_ARP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# stack
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=2048

# dhcp4
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=4
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_DNS_RESOLVER_ADDITIONAL_BUF_CTR=5
CONFIG_DNS_RESOLVER_ADDITIONAL_QUERIES=2
CONFIG_MDNS_RESOLVER=y
CONFIG_LLMNR_RESOLVER=n

# Network buffers
#CONFIG_NET_PKT_RX_COUNT=16
#CONFIG_NET_PKT_TX_COUNT=16
#CONFIG_NET_BUF_RX_COUNT=64
#CONFIG_NET_BUF_TX_COUNT=64
#CONFIG_NET_CONTEXT_NET_PKT_POOL=y
#CONFIG_NET_BUF_DATA_SIZE=1600
#CONFIG_NET_BUF_ALIGNMENT=32
#CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=64240
#CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=64240

# IP address options
#CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
#CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=4
#CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=3
#CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=4
#CONFIG_NET_MAX_CONTEXTS=20
#CONFIG_NET_MAX_CONN=20

# Number of socket descriptors
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_ZVFS_POLL_MAX=16

# Kernel options
CONFIG_ENTROPY_GENERATOR=y
CONFIG_INIT_STACKS=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_SHELL=y
CONFIG_SLIP_STATISTICS=n

# zperf
CONFIG_NET_ZPERF=y

# Logging
CONFIG_PRINTK=y
CONFIG_NET_LOG=y
CONFIG_LOG=y
#CONFIG_NET_STATISTICS=y

# W5500 support
CONFIG_ETH_W5500=y
CONFIG_ETH_W5500_TIMEOUT=1000
CONFIG_SPI=y
# Workaround: GCC 14.3.0 -O2 generates code incompatible with this target;
# use -Os to reduce optimization aggressiveness.
CONFIG_COMPILER_OPT="-O2 -fno-tree-dse -fno-tree-dce -fno-tree-dominator-opts"
