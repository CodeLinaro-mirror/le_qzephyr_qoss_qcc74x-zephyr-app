#
# QCC748M EVK: default 84 * 1600B packet buffers overflow 320KB SRAM.
# Reduce counts to stay within memory limits.

CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_BUF_DATA_SIZE=1500

# Disable IPv6: with only 8 RX buffers, router RA flooding starves ARP/DHCP/ICMP
CONFIG_NET_IPV6=n
