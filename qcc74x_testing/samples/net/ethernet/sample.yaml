sample:
  name: Ethernet smoke test for QCC7xx

common:
  depends_on: eth
  tags:
    - net
    - ethernet
    - netif:eth
  timeout: 60
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "ETHERNET SMOKE TEST PASSED"

tests:
  qcc7xx.sample.net.ethernet:
    platform_allow:
      - qcc744m_evk
      - qcc748m_evk
