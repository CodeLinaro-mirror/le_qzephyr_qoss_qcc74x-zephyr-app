sample:
  name: QCC74x ADC devicetree DMA sample (project-owned)
common:
  tags:
    - adc
  depends_on: adc
  filter: dt_node_has_prop("/zephyr,user","io-channels")
  harness: console
  timeout: 10
  harness_config:
    type: multi_line
    regex:
      - "ADC reading\\[\\d+\\]:"
      - "- .+, channel \\d+: -?\\d+"
tests:
  qcc7xx.sample.drivers.adc.adc_dt.dma_74x:
    platform_allow:
      - qcc748m_evk/qcc748
