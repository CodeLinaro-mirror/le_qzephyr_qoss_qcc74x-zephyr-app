sample:
  name: QCC74x ADC sequence DMA sample (project-owned)
common:
  tags:
    - adc
  depends_on: adc
  filter: dt_alias_exists("adc0")
  harness: console
  timeout: 10
  harness_config:
    type: multi_line
    regex:
      - "ADC sequence reading \\[\\d+\\]:"
      - "- .+, channel \\d+, \\d+ sequence samples:"
      - "- - \\d+ (= \\d+mV)|(\\(value in mV not available\\))"
tests:
  qcc7xx.sample.drivers.adc.adc_sequence.dma_74x:
    platform_allow:
      - qcc748m_evk/qcc748
