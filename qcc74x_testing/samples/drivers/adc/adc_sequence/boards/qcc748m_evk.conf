# QCC74x ADC sequence DMA path on qcc748m_evk:
#  - CONFIG_ADC_QCC74X_DMA=y     selects the DMA-driven ADC sequence path
#                                (vs the default polling/interrupt path);
#                                requires the &dma node + adc `dmas` property
#                                wired in qcc748m_evk.overlay.
#  - SEQUENCE_RESOLUTION=16 / SEQUENCE_32BITS_REGISTERS=y are the known-good
#    QCC74x values for this SoC's 16-bit ADC with 32-bit sample registers.
CONFIG_ADC_QCC74X_DMA=y
CONFIG_SEQUENCE_RESOLUTION=16
CONFIG_SEQUENCE_32BITS_REGISTERS=y
