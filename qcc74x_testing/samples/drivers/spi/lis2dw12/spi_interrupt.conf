# Enable interrupt-driven SPI transfers
CONFIG_SPI_QCC74X_INTERRUPT=y

# Enable async SPI mode (non-blocking with signal/callback)
CONFIG_SPI_ASYNC=y

# Enable debug logging for SPI driver (comment out for better async timing)
# CONFIG_SPI_LOG_LEVEL_DBG=y
