tests:
  qcc7xx.sample.drivers.spi:
    build_only: true
    platform_allow:
      - qcc743m_evk
      - qcc744m_evk
      - qcc748m_evk
      - qcc75xm_evk
  qcc7xx.sample.drivers.spi.dma:
    build_only: true
    platform_allow:
      - qcc743m_evk
      - qcc744m_evk
      - qcc748m_evk
      - qcc75xm_evk
    extra_args:
      - EXTRA_CONF_FILE=spi_dma.conf
      - EXTRA_DTC_OVERLAY_FILE=spi_dma.overlay
