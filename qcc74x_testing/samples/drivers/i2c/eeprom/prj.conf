# Enable subsystems
CONFIG_I2C=y
CONFIG_EEPROM=y

# Enable logging
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EEPROM_LOG_LEVEL_WRN=y
CONFIG_I2C_LOG_LEVEL_WRN=y

# Optimization
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_ENTROPY_GENERATOR=y
