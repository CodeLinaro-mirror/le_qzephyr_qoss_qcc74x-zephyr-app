tests:
  qcc7xx.sample.drivers.crypto:
    platform_allow:
      - qcc743m_evk
      - qcc744m_evk
      - qcc748m_evk
      - qcc75xm_evk
    tags: 
      - crypto
    harness: console
    harness_config:
      type: multi_line
      regex:
        - ".*Cipher Sample"
        - ".*ECB mode ENCRYPT - Match"
        - ".*ECB mode DECRYPT - Match"
        - ".*CBC mode ENCRYPT - Match"
        - ".*CBC mode DECRYPT - Match"
        - ".*CTR mode ENCRYPT - Match"
        - ".*CTR mode DECRYPT - Match"
    timeout: 60
