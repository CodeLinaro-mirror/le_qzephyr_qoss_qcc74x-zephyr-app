# common
#CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PRINTK=y

# enable logging and debug info
#CONFIG_DEBUG=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# assert
#CONFIG_ASSERT=y
#CONFIG_ASSERT_LEVEL=2
#CONFIG_SYS_HEAP_VALIDATE=y

# Enable heap statistics and runtime checks
CONFIG_HEAP_MEM_POOL_SIZE=16784
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SHARED_MULTI_HEAP=y

# net pool definitions
CONFIG_NET_BUF=y
CONFIG_NET_BUF_POOL_USAGE=y

# enable DMA
CONFIG_DMA=y
