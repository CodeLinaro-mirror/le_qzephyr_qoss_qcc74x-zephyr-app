sample:
  name: QCC7xx MJPEG encoder sample
tests:
  qcc7xx.drivers.jpeg:
    platform_allow:
      - qcc744m_evk
      - qcc748m_evk
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Encoding"
        - "JPEG encoded OK"