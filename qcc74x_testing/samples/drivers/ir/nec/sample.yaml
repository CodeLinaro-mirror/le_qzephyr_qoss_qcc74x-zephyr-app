sample:
  description: A sample application to receive IR (infrared) data using NEC protocol.
  name: ir_nec_sample
tests:
  sample.drivers.ir.nec:
    tags: ir
    depends_on: ir
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "Press any button in NEC remote contoller"
        - "IR data received: x[0-9a-fA-F]+"
    platform_allow:
      - qcc748m_evk
