common:
  tags:
    - drivers
    - gpio
  depends_on: gpio
  harness: ztest
  harness_config:
    fixture: gpio_loopback
tests:
  drivers.gpio.2pin.qcc:
    min_flash: 34
    filter: >
      dt_compat_enabled("test-gpio-basic-api")
      and not dt_compat_enabled("arduino-header-r3")
    platform_allow:
      - qcc748m_evk
    integration_platforms:
      - qcc748m_evk
