common:
  tags: usb drivers cdc_acm
  platform_allow:
    - qcc748m_evk
  harness: pytest
  harness_config:
    pytest_root: ["scripts"]
    pytest_dut_scope: session
  timeout: 180

tests:
  qcc7xx.drivers.usb.cdc_acm:
    extra_args: DTC_OVERLAY_FILE=boards/qcc748m_evk.overlay
