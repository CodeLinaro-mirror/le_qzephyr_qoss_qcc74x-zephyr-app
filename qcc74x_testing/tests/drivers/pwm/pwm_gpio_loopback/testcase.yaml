common:
  depends_on: pwm
  tags:
    - drivers
    - pwm
  harness: ztest
  harness_config:
    fixture: gpio_loopback
tests:
  drivers.pwm.gpio_loopback.esp:
    platform_allow:
      - esp32_devkitc_wrover/esp32/procpu
      - esp8684_devkitm
      - esp32c3_devkitm
      - esp32c6_devkitc
      - esp32s2_saola
      - esp32s3_devkitm/esp32s3/procpu

  drivers.pwm.gpio_loopback.nrf:
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp

  drivers.pwm.gpio_loopback.qcc7xx_xclk:
    platform_allow:
      - qcc743m_evk
      - qcc744m_evk
      - qcc748m_evk
      - qcc75xm_evk
  drivers.pwm.gpio_loopback.qcc7xx_bclk:
    platform_allow:
      - qcc743m_evk
      - qcc744m_evk
      - qcc748m_evk
      - qcc75xm_evk
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/qcc7xxm_evk_bclk.overlay"
  drivers.pwm.gpio_loopback.qcc7xx_clk_32k:
    platform_allow:
      - qcc743m_evk
      - qcc744m_evk
      - qcc748m_evk
      - qcc75xm_evk
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="boards/qcc7xxm_evk_clk_32k.overlay"