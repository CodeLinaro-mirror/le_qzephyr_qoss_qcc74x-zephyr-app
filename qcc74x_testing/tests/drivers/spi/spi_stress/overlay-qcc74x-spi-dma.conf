# Force DMA mode for QCC74x SPI controller
CONFIG_SPI_QCC74X_DMA=y
CONFIG_DMA=y
CONFIG_SPI_ASYNC=n
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_DMA_CH_TRANSFER_BLOCK_MAX=10
CONFIG_DMA_CH_TRANSFER_LLI_MAX=32

# The DMA path allocates TX/RX bounce buffers from the system heap via
# k_aligned_alloc().  The stress test_spi_max_length_repeat mallocs
# 2×8192 B from the heap *and* the DMA driver then allocates TX+RX
# bounce buffers (~2×8192 B) with cache-line alignment overhead.
# Total peak usage ≈ 4×8192 + metadata ≈ 34 KB → size with margin.
CONFIG_HEAP_MEM_POOL_SIZE=49152
