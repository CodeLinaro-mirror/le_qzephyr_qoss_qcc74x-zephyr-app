# SPI DMA mode, sized for the multi-block throughput run.
#
# The throughput commands describe a whole run as one transaction of four
# 64-KB blocks, so CS stays asserted end to end and the slave never has to
# re-arm between blocks.  The HAL splits each DMA block into LLI entries of
# 4064 bytes drawn from a per-channel pool, so a 64-KB block costs 17 entries.
#
# This is scoped to the throughput configuration rather than raised globally.
CONFIG_DMA=y
CONFIG_SPI_QCC74X_DMA=y
CONFIG_DMA_CH_TRANSFER_LLI_MAX=72
CONFIG_SPI_LOG_LEVEL_ERR=y

# spi_shell places its fixed buffers in aligned, non-cacheable internal RAM,
# so the DMA path can use them directly without a heap bounce buffer.
CONFIG_PSRAM=n
CONFIG_HEAP_MEM_POOL_SIZE=8192
