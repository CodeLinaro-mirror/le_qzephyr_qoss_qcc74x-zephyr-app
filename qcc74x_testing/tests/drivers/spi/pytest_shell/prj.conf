# Shell on UART
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_QCOM_SPI_SHELL=y

# SPI
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_QCOM_SPI_SHELL_BUFFER_SIZE=65536

# Logging
CONFIG_LOG=y
CONFIG_SPI_LOG_LEVEL_INF=y

# Heap for buffers
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Thread stack
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
