common:
  depends_on: spi
  tags:
    - drivers
    - spi
  filter: dt_compat_enabled("test-spi-loopback-slow") and
          dt_compat_enabled("test-spi-loopback-fast")
  harness: ztest
  harness_config:
    fixture: spi_loopback
tests:
  qcc7xx.drivers.spi.loopback.opal_spi_polling:
    extra_args: EXTRA_CONF_FILE="overlay-qcc74x-spi-polling.conf"
    platform_allow:
      - qcc743m_evk
      - qcc744m_evk
      - qcc748m_evk
  qcc7xx.drivers.spi.loopback.opal_spi_dma:
    extra_args: EXTRA_CONF_FILE="overlay-qcc74x-spi-dma.conf"
    platform_allow:
      - qcc743m_evk
      - qcc744m_evk
      - qcc748m_evk
  qcc7xx.drivers.spi.loopback.opal_spi_interrupt:
    extra_args: EXTRA_CONF_FILE="overlay-qcc74x-spi-interrupt.conf"
    platform_allow:
      - qcc743m_evk
      - qcc744m_evk
      - qcc748m_evk
