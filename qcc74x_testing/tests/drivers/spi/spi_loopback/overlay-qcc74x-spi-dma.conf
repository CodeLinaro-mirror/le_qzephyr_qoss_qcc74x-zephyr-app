# Force DMA mode for QCC74x SPI controller
CONFIG_SPI_QCC74X_DMA=y
CONFIG_DMA=y
CONFIG_SPI_ASYNC=n

# The DMA path allocates TX/RX bounce buffers from the system heap via
# k_aligned_alloc(). The spi_loopback "complete large transfers" subtest uses
# an 8192-byte buffer, which needs TX + RX bounce allocations plus cache-line
# alignment overhead -- more than the board default heap (4096 B). Size the
# heap to cover the largest concurrent TX+RX bounce allocation with margin.
CONFIG_HEAP_MEM_POOL_SIZE=32768

