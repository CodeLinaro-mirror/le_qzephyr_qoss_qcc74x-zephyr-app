# Flash and LittleFS fixture support
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SOC_FLASH_QCC74X=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y

# Keep host-generated littlefs.bin geometry explicit and reproducible.
CONFIG_FS_LITTLEFS_READ_SIZE=16
CONFIG_FS_LITTLEFS_PROG_SIZE=16
CONFIG_FS_LITTLEFS_CACHE_SIZE=64
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=32

# OTA SHA-256 verification
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# ztest / console diagnostics
CONFIG_ZTEST=y
# PSA SHA-256 initialization and the file-to-flash staging path execute in the
# ztest worker thread.  Keep this test-only stack deliberately generous so a
# target-side crypto implementation cannot corrupt the fault-report path.
CONFIG_ZTEST_STACK_SIZE=10240
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
