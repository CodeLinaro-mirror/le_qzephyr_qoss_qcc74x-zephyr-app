# QCC74x generic low-power overlay for qcc74x wifi/shell validation.
#
# This is the only maintained low-power overlay. It covers the current
# PDS15/LPFW/Wi-Fi low-power path, including Wi-Fi connected resume.
# Do not add new stage-specific overlays; update this file instead.

# System PM / PDS15
CONFIG_PM=y
CONFIG_PM_POLICY_CUSTOM=y
CONFIG_PM_CPU_SHELL=y
CONFIG_PM_DEVICE=y
CONFIG_PM_NEED_ALL_DEVICES_IDLE=n
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n
CONFIG_PSRAM=n
CONFIG_RISCV_MACHINE_TIMER=n

CONFIG_QCC74X_PM_PDS15=y
CONFIG_QCC74X_PM_PDS15_POLICY=y
CONFIG_QCC74X_PM_PDS15_UART_RESUME=y

# QCC74x Wi-Fi low-power
CONFIG_QCC74X_WIFI_LOW_POWER=y

# Validation shell / diagnostics
CONFIG_QCC74X_PM_DIAGNOSTICS=y
CONFIG_QCC74X_PM_PDS15_LOG_LEVEL_OFF=y
CONFIG_WIFI_SHELL_LOWPOWER_VALIDATION=y

# Minimal runtime requirements
CONFIG_THREAD_LOCAL_STORAGE=y
CONFIG_CURRENT_THREAD_USE_TLS=y
CONFIG_SHELL_PROMPT_UART="qcc74x:~$"
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_PRINTK=y

# The current qcc74x_devkitp validation image keeps Zephyr RAM in on-chip
# SRAM, so trim the heap while preserving the Wi-Fi/PDS15 flow.
CONFIG_HEAP_MEM_POOL_SIZE=26624
