# QCC74x BLE + WiFi joint low-power overlay.
# Stack with overlay-lowpower.conf: `-DEXTRA_CONF_FILE="overlay-lowpower.conf;overlay-ble-lowpower.conf"`.

# Bluetooth host + controller
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_SHELL=y

CONFIG_BT_DEVICE_NAME="qcc74x-lp"
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
# 160 * 1.25ms = 200ms, 320 * 1.25ms = 400ms
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=160
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=320
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# btblecontroller 1.6.119 lacks HCI_Host_Buffer_Size opcode 0x0c33;
# disable host-side ACL flow control or bt_enable() returns -5.
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n

# Engage BLE side of PDS15
CONFIG_QCC74X_PM_PDS15_BLE=y

# BLE + WiFi protocol stacks need ~28-30K heap (50K overruns RAM).
CONFIG_HEAP_MEM_POOL_SIZE=28672
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=768
CONFIG_BT_BUF_EVT_RX_COUNT=4
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1

# Keep the full Wi-Fi runtime path, but use the validated minimum network
# packet pools from the previous BLE + Wi-Fi PDS15 image. The qcc74x default
# pools (16/24 packets and 16/24 buffers) consume too much on-chip SRAM for
# this combined low-power image.
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=14
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=16

