# PSRAM: enable 4MB PSRAM with code-copy support on qcc748.
CONFIG_FLASH_XIP_LENGTH=0x400000
CONFIG_PSRAM=y
CONFIG_PSRAM_LENGTH=0x400000
CONFIG_PSRAM_COPY_CODE=y

# Higher TX buffer counts for throughput (RvR/tput) testing. NOT the default —
# at 32/36 with CONFIG_ZPERF_SESSION_PER_THREAD=n these values
# exhausted OCRAM at boot on constrained builds. Only apply this overlay when
# running throughput tests; the base socs/qcc748.conf default is 24/24.
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=36
