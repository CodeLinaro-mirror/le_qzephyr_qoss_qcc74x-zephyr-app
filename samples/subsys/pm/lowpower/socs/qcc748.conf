# QCC748 PDS uses LPFW and its PDS-aware system timer. The current SDK
# implementation symbol retains the PDS15 name below.
CONFIG_PSRAM=n
CONFIG_RISCV_MACHINE_TIMER=n
CONFIG_QCC74X_PM_PDS15=y

# LPFW verification uses the SEC SHA engine. The enabled board TRNG shares the
# SEC0 clock domain; its entropy driver configures and enables that clock at
# PRE_KERNEL_1, before PDS's delayed LPFW auto-init.
CONFIG_ENTROPY_GENERATOR=y
