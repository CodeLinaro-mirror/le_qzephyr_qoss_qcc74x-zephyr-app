# Generic Zephyr power-management and console support.
CONFIG_PM=y
CONFIG_PM_POLICY_CUSTOM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y
CONFIG_PM_NEED_ALL_DEVICES_IDLE=n
CONFIG_GPIO=y

# Keep the demo's serial status output available across each RTC wake cycle.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_PRINTK=y

# Minimal application runtime memory.
CONFIG_HEAP_MEM_POOL_SIZE=4096
