# Network management queues used by the QCC74x Wi-Fi driver. Scan results and
# connect/disconnect completions are delivered asynchronously, so the queue
# must absorb events while the protocol thread is handling another request.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# Wi-Fi packet processing runs in Zephyr network TX/RX threads. These stack
# sizes are platform requirements rather than the smartconfig protocol thread
# stack defined in main.c.
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096

# IPv6 is not part of this station-provisioning contract; limiting the network
# stack to IPv4 keeps the combined BLE/Wi-Fi image smaller and deterministic.
CONFIG_NET_IPV6=n
