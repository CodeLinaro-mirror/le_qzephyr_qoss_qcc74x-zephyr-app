# Common networking and QCC74x Wi-Fi baseline.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_QCC74X=y
CONFIG_QC7XX_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y

# Bluetooth Host over the board's QCC74x HCI/controller interface.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="BTBLE-DEV"
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n

# Match the qcc74xsync ATT/GATT transport capacity.
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# The QCC74x Wi-Fi integration uses the Ethernet L2/net_if plumbing even
# though the user-facing radio is Wi-Fi.
CONFIG_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_THREAD_CUSTOM_DATA=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=32708

CONFIG_MBEDTLS_ECP_NIST_OPTIM=y
CONFIG_PSA_CRYPTO_ENABLE_ALL=y
CONFIG_MBEDTLS_CTR_DRBG_C=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y

CONFIG_LOG=y
